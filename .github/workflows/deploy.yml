name: 배포

# main에 합치면 자동으로 배포한다. 문서만 바꾼 커밋은 건너뛴다.
# 되돌리기와 재배포는 Actions 화면의 버튼으로 한다. 쓰기 권한이 있는 사람만 누를 수 있다.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      action:
        description: 할 일
        type: choice
        options: [deploy, rollback]
        default: deploy

# 여러 PR이 합쳐져도 하나씩 차례로 돈다. 진행 중인 배포를 끊지 않고, 기다리는 배포는 가장 최근 것만 남는다.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 서버 접속 비밀값은 main에서만 꺼낼 수 있도록 이 환경에 둔다.
    environment: production
    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: env.ACTION == 'deploy'
        with:
          node-version: 22
          cache: npm

      # PR을 검사한 뒤 main이 달라졌을 수 있으니 합쳐진 코드를 다시 검사한다.
      - name: 합쳐진 코드 검사
        if: env.ACTION == 'deploy'
        run: |
          npm ci
          npx tsc -b
          npx vite build

      - name: 서버 접속 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy-server\n  HostName %s\n  User ec2-user\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n' "$DEPLOY_HOST" > ~/.ssh/config

      - name: 데이터 백업
        run: ssh deploy-server 'cd ~/harudle-world/deploy && ./backup.sh'

      - name: 코드 올리기
        if: env.ACTION == 'deploy'
        run: >-
          rsync -az
          --exclude .git --exclude .github --exclude node_modules --exclude dist --exclude .data --exclude .DS_Store --exclude '*.pem'
          --exclude deploy/.env --exclude deploy/.active-color --exclude deploy/.deploy.lock --exclude deploy/backups --exclude deploy/caddy/upstream.caddy
          ./ deploy-server:~/harudle-world/

      - name: 무중단 배포
        if: env.ACTION == 'deploy'
        run: ssh deploy-server 'cd ~/harudle-world/deploy && ./deploy.sh'

      - name: 직전 버전으로 되돌리기
        if: env.ACTION == 'rollback'
        run: ssh deploy-server 'cd ~/harudle-world/deploy && ./deploy.sh rollback'

      - name: 사이트 확인
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors https://world.harudle.com/

      - name: 접속 정보 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
