# 서버를 파랑·초록 두 벌로 정의해 번갈아 띄운다. 평소에는 한 벌만 돈다. deploy.sh로 실행한다.
x-world: &world
  restart: unless-stopped
  # 재배포 때 접속을 정리할 시간을 준다.
  stop_grace_period: 15s
  environment:
    # 사이트와 서버가 같은 주소라 이 주소에서 온 요청만 받는다.
    ALLOWED_ORIGINS: https://${DOMAIN:?deploy/.env에 DOMAIN을 적어 주세요}
    MAX_PLAYERS: ${MAX_PLAYERS:-150}
    # Caddy 뒤에서만 접속되므로 실제 접속자 IP를 Caddy가 넘긴 값에서 읽는다.
    TRUST_PROXY: '1'
    # 둘 다 있을 때만 메타모아로 접속자 수를 보낸다.
    METAMOA_SPACE_ID: ${METAMOA_SPACE_ID:-}
    METAMOA_KEY: ${METAMOA_KEY:-}
  volumes:
    # 두 벌이 같은 DB를 쓴다. 같은 서버 안이라 SQLite WAL로 잠깐 겹쳐도 안전하다.
    - world-data:/data

services:
  world-blue:
    <<: *world
    build: ..
    image: harudle-world:blue

  world-green:
    <<: *world
    build: ..
    image: harudle-world:green

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env에 DOMAIN을 적어 주세요}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # 방명록, 문제, 릴레이 글이 들어 있다. 지우면 복구할 수 없다.
  world-data:
  caddy-data:
  caddy-config:
